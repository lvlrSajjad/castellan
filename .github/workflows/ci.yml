name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: castellan
          POSTGRES_DB: castellan
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: TypeORM parity suite on Postgres
        run: pnpm --filter @castellan/typeorm test
        env:
          CASTELLAN_PG_URL: postgres://postgres:castellan@localhost:5432/castellan
      - run: pnpm build

  compat:
    name: Compat (NestJS 10 + TypeORM 0.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Downgrade to NestJS 10 / TypeORM 0.3
        run: |
          pnpm --filter @castellan/typeorm add -D typeorm@^0.3 better-sqlite3@^11
          pnpm --filter @castellan/nestjs add -D @nestjs/common@^10 @nestjs/core@^10 @nestjs/testing@^10 @nestjs/platform-express@^10 @nestjs/typeorm@^10 typeorm@^0.3 better-sqlite3@^11
      - run: pnpm --filter @castellan/typeorm --filter @castellan/nestjs test
      - run: pnpm --filter @castellan/typeorm --filter @castellan/nestjs typecheck
