name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  databases:
    name: Parity on ${{ matrix.db }}${{ matrix.db == 'mysql' && format(' {0}', matrix.mysql) || '' }} (TypeORM ${{ matrix.typeorm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql]
        typeorm: ['1', '0.3']
        mysql: ['8.4']
        include:
          # MySQL 8.0 (and engines compatible with it), on the current TypeORM only.
          - db: mysql
            typeorm: '1'
            mysql: '8.0'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: castellan
          POSTGRES_DB: castellan
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: castellan
          MYSQL_DATABASE: castellan
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcastellan" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use TypeORM 0.3
        if: matrix.typeorm == '0.3'
        run: pnpm --filter @castellanjs/typeorm add -D typeorm@^0.3 better-sqlite3@^11
      - name: Both parity suites (store-backed and scoped)
        run: pnpm --filter @castellanjs/typeorm test
        env:
          CASTELLAN_PG_URL: ${{ matrix.db == 'postgres' && 'postgres://postgres:castellan@localhost:5432/castellan' || '' }}
          CASTELLAN_MYSQL_URL: ${{ matrix.db == 'mysql' && 'mysql://root:castellan@127.0.0.1:3306/castellan' || '' }}

  compat:
    name: Compat (NestJS 10 + TypeORM 0.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Downgrade to NestJS 10 / TypeORM 0.3
        run: |
          pnpm --filter @castellanjs/typeorm add -D typeorm@^0.3 better-sqlite3@^11
          pnpm --filter @castellanjs/nestjs add -D @nestjs/common@^10 @nestjs/core@^10 @nestjs/testing@^10 @nestjs/platform-express@^10 @nestjs/typeorm@^10 typeorm@^0.3 better-sqlite3@^11
      - run: pnpm --filter @castellanjs/typeorm --filter @castellanjs/nestjs test
      - run: pnpm --filter @castellanjs/typeorm --filter @castellanjs/nestjs typecheck
